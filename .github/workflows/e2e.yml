name: E2E Tests

on:
  push:
    branches: [main]
    paths: ['frontend/**']
  pull_request:
    branches: [main]
    paths: ['frontend/**']
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Build Flutter web (prod)
        working-directory: frontend
        run: flutter build web -t lib/main_prod.dart

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/e2e/package-lock.json

      - name: Install E2E dependencies
        working-directory: frontend/e2e
        run: npm ci && npx playwright install chromium --with-deps

      - name: Run E2E tests
        working-directory: frontend/e2e
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: npx playwright test --reporter=html,json

      - name: Generate test summary
        if: always()
        working-directory: frontend/e2e
        run: |
          if [ -f test-results/.last-run.json ]; then
            STATUS=$(cat test-results/.last-run.json | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])" 2>/dev/null || echo "unknown")
          else
            STATUS="unknown"
          fi
          echo "## 🌐 E2E Tests (Playwright)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$STATUS" = "passed" ]; then
            echo "✅ All E2E tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Some tests failed — see report artifact for details" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📥 HTMLレポートは Artifacts からダウンロードできます" >> $GITHUB_STEP_SUMMARY

      - name: Upload E2E HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: frontend/e2e/playwright-report/
          retention-days: 14

      - name: Upload test results (traces)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: frontend/e2e/test-results/
          retention-days: 7
